version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: erp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: erp_platform_db
    ports:
      - "3306:3306"
    volumes:
      - erp_db_data:/var/lib/mysql
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      API_PREFIX: /api/v1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: erp_platform_db
      DB_CONNECTION_LIMIT: 25
      JWT_SECRET: super_secure_production_secret_key_lowcode_erp_2026_xyz
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: super_secure_refresh_production_secret_key_lowcode_erp_2026_abc
      JWT_REFRESH_EXPIRES_IN: 7d
      MEDIA_STORAGE_PATH: /var/erp_storage
      MAX_FILE_SIZE_MB: 10
      ALLOWED_MIME_TYPES: image/jpeg,image/png,image/webp,image/svg+xml,image/x-icon,application/pdf
      CORS_ORIGIN: http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - erp_media_data:/var/erp_storage
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - erp_network

volumes:
  erp_db_data:
    driver: local
  erp_media_data:
    driver: local

networks:
  erp_network:
    driver: bridge
